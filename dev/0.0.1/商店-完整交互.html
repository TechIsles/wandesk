<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>商店原型 · 完整交互</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ── 商店原型:侧栏导航 + 内容页(发现 / 搜索 / 应用页 / 资料库 / 发布 / 审核)。
      全部状态在页内可走通:登录门、安装进度、更新、评分评论与回复、提交→审核→打回→重交→上架→下架。
      顶部灰条是原型用的角色切换,不属于产品。 ── */
:root{
  --surface:#fff;--side:linear-gradient(180deg,#e6f3fd 0%,#c3ddf4 40%,#9ccbec 70%,#b3d5f0 100%);
  --t1:rgba(16,19,28,.96);--t2:rgba(19,23,36,.86);--t3:rgba(26,32,52,.58);--t4:rgba(28,34,56,.42);
  --accent:#3b82f6;--accent-deep:#1e3287;--accent-soft:rgba(59,130,246,.1);--ring:rgba(98,165,244,.35);
  --edge:#cfe0f4;--edge-soft:#e6eef7;--fill:rgba(95,136,176,.09);--hover:rgba(95,136,176,.12);
  --danger:#b3382a;--danger-soft:#fdeceb;--ok:#159a6e;--ok-soft:#e4f6ef;--warn:#b26a08;--warn-soft:#fdf1df;--star:#f0a30a;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.55 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:var(--t1);background:#f0f0f0;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}
code{font:12px var(--mono);background:var(--fill);padding:1px 5px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cbd3dd;border-radius:6px;border:2px solid transparent;background-clip:content-box}

/* 原型工具条 */
.devbar{position:absolute;left:18px;right:18px;top:0;height:18px;display:flex;align-items:center;gap:10px;font-size:11px;color:#555;z-index:5}
.devbar b{font-weight:600}
.devbar button{font-size:11px;padding:0 7px;height:15px;border-radius:3px;border:1px solid #bbb;background:#fafafa;color:#333}
.devbar button.on{background:#333;color:#fff;border-color:#333}

/* 窗口壳 */
.win{position:absolute;inset:22px 18px 18px;border:1px solid #6c8fb1;border-radius:8px;overflow:hidden;background:var(--surface);
  box-shadow:0 24px 48px rgba(20,45,75,.3),0 4px 12px rgba(20,45,75,.18);display:flex;flex-direction:column}
.winbar{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:600;color:#173d63;
  background:linear-gradient(180deg,#e9f4fd,#c9e0f5);border-bottom:1px solid #8fb0cf;position:relative}
.winbar::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.05));pointer-events:none}
.winbar .btns{margin-left:auto;display:flex;gap:6px}
.winbar .btns i{width:30px;height:18px;border-radius:3px;border:1px solid #7f9fbf;background:linear-gradient(180deg,#fff,#d6e6f6)}
.winbar .btns i.x{background:linear-gradient(180deg,#f7b5a8,#d9483a);border-color:#a03a2c}
.body{flex:1;min-height:0;display:flex;position:relative}

/* 侧栏 */
.side{width:212px;flex:none;background:var(--side);border-right:1px solid #5f88b0;position:relative;display:flex;flex-direction:column;padding:10px 8px}
.side::after{content:"";position:absolute;left:0;right:0;top:0;height:34%;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.05));pointer-events:none}
.side>*{position:relative;z-index:1}
.search{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border-radius:7px;background:rgba(255,255,255,.72);border:1px solid #9dbad8;box-shadow:inset 0 1px 2px rgba(20,50,80,.1)}
.search svg{width:13px;height:13px;stroke:#4b6a8a;fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:13px;color:#16324f}
.search input::placeholder{color:#6d8aa8}
.search kbd{font:10.5px var(--mono);color:#5d7a98;border:1px solid #9dbad8;border-radius:3px;padding:0 4px;background:rgba(255,255,255,.6)}
.nav{margin-top:12px;display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#456787;padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:6px;font-size:13px;color:#1b2f47;cursor:pointer;border:1px solid transparent;text-decoration:none}
.nav a:hover{background:var(--hover)}
.nav a.on{background:linear-gradient(180deg,#fff,#e2f0fc);border-color:#bcd8f2;box-shadow:inset 0 0 0 1px #fff;font-weight:600}
.nav a .ic{width:16px;text-align:center;font-size:14px}
.nav a .n{margin-left:auto;font-size:11px;font-weight:600;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.nav a .n.warn{background:var(--warn)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding:8px 8px 2px;font-size:12.5px;color:#2c4a68}
.side-foot .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#7fb3ee,#3b82f6);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.side-foot .who{flex:1;min-width:0;line-height:1.2}
.side-foot .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:11px;color:#5d7a98}

/* 内容区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);position:relative}
.top{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--edge-soft)}
.top .back{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t3)}
.top .back:hover{background:var(--fill);color:var(--t1)}
.top .back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h1{font-size:14px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--t4)}
.scroll{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}
.page{max-width:980px;margin:0 auto;padding:22px 28px 60px}
.page.narrow{max-width:820px}
h2.sec{font-size:17px;font-weight:700;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec:first-child{margin-top:0}
h2.sec small{font-size:12.5px;font-weight:400;color:var(--t4)}
h2.sec .more{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--accent)}
.hint{font-size:12.5px;color:var(--t3);line-height:1.6;margin:0 0 12px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--t1);background:#fff;border:1px solid var(--edge);white-space:nowrap;transition:background .12s,filter .12s}
.btn:hover{background:#f6f9fd}
.btn.pri{color:#fff;background:var(--accent);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:#fff;background:var(--danger);border-color:transparent;font-weight:600}
.btn.sm{height:26px;padding:0 11px;font-size:12.5px;border-radius:6px}
.btn.pill{border-radius:999px;height:28px;padding:0 15px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.quiet{border-color:transparent;color:var(--accent)}
.btn.quiet:hover{background:var(--accent-soft)}
.link{font-size:12.5px;color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}
.link.danger{color:var(--danger)}
/* 安装按钮的四态:安装 → 进度 → 打开;更新 */
.get{position:relative;overflow:hidden;min-width:74px}
.get.busy{color:transparent;pointer-events:none;background:var(--accent-soft);border-color:transparent}
.get.busy::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--accent);transition:width .25s}
.get.busy::after{content:attr(data-p);position:absolute;inset:0;display:grid;place-items:center;color:var(--accent-deep);font-size:12px;font-weight:600}

/* 状态胶囊 */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--t3);background:var(--fill);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}.pill.warn{color:var(--warn);background:var(--warn-soft)}.pill.bad{color:var(--danger);background:var(--danger-soft)}.pill.mute{color:var(--t4)}
.stars{display:inline-flex;gap:1px;color:#d7dee8;line-height:1;letter-spacing:-.5px}
.stars i{font-style:normal}.stars i.on{color:var(--star)}.stars i.half{background:linear-gradient(90deg,var(--star) 50%,#d7dee8 50%);-webkit-background-clip:text;color:transparent}

/* 发现页 */
.hero{position:relative;border-radius:14px;overflow:hidden;min-height:250px;display:flex;align-items:flex-end;padding:24px 26px;color:#fff;cursor:pointer;
  background:radial-gradient(1200px 400px at 10% 0%,#4f8bf0 0%,#1e3a8a 45%,#0f1f4d 100%)}
.hero::before{content:attr(data-icon);position:absolute;right:40px;top:-10px;font-size:220px;opacity:.14;filter:blur(1px)}
.hero .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.hero h3{font-size:28px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;max-width:520px;opacity:.9;font-size:14px}
.hero .row{display:flex;align-items:center;gap:14px;margin-top:16px}
.hero .btn{background:#fff;color:var(--accent-deep);border-color:transparent;font-weight:600}.hero .btn.busy{background:rgba(255,255,255,.25)}.hero .btn.busy::after{color:#fff}
.hero .meta{font-size:12.5px;opacity:.85;display:flex;gap:12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);font-size:12.5px;color:var(--t2);background:#fff}
.chip:hover{background:#f6f9fd}.chip.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 12px;border-radius:12px;border:1px solid var(--edge-soft);background:#fff;cursor:pointer;scroll-snap-align:start;transition:border-color .12s,box-shadow .12s,transform .12s}
.card:hover{border-color:var(--edge);box-shadow:0 6px 18px rgba(30,60,100,.08);transform:translateY(-1px)}
.card .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none;background:linear-gradient(180deg,#f6f9fd,#e9f0f8);border:1px solid var(--edge-soft)}
.card .m{flex:1;min-width:0;display:flex;flex-direction:column}
.card .n{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .d{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card .r{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t4);margin-top:4px}
.card .r .stars{font-size:11px}
.card .btn{flex:none}
.rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 24px}
.rank .card{border:0;border-bottom:1px solid var(--edge-soft);border-radius:0;padding:10px 4px;transform:none;box-shadow:none}
.rank .card .no{width:20px;font:600 14px var(--mono);color:var(--t4);text-align:center;flex:none}
.rank .card .ic{width:46px;height:46px;font-size:24px;border-radius:11px}
.empty{padding:60px 20px;text-align:center;color:var(--t4)}
.empty b{display:block;color:var(--t2);font-weight:600;font-size:15px;margin-bottom:4px}

/* 应用页 */
.ahead{display:flex;gap:20px;align-items:flex-start}
.ahead .ic{width:112px;height:112px;border-radius:26px;display:grid;place-items:center;font-size:62px;flex:none;background:linear-gradient(180deg,#f6f9fd,#e5edf7);border:1px solid var(--edge-soft);box-shadow:0 8px 24px rgba(30,60,100,.1)}
.ahead .t{flex:1;min-width:0}
.ahead h3{font-size:26px;margin:2px 0 2px;font-weight:800;letter-spacing:-.01em}
.ahead .by{font-size:14px;color:var(--t3)}
.ahead .by b{color:var(--accent);font-weight:500;cursor:pointer}
.ahead .act{display:flex;align-items:center;gap:10px;margin-top:14px}
.ahead .act .note{font-size:12px;color:var(--t4)}
.facts{display:flex;gap:0;margin:22px 0 4px;border-top:1px solid var(--edge-soft);border-bottom:1px solid var(--edge-soft)}
.fact{flex:1;padding:12px 6px;text-align:center;border-right:1px solid var(--edge-soft)}
.fact:last-child{border-right:0}
.fact .k{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t4)}
.fact .v{font-size:16px;font-weight:700;margin-top:2px;line-height:1.2}
.fact .v small{font-size:11px;font-weight:500;color:var(--t4);display:block}
.fact .v .stars{font-size:11px;display:flex;justify-content:center;margin-top:2px}
.shots{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin-top:18px;scroll-snap-type:x mandatory}
.shot{flex:none;width:420px;height:262px;border-radius:12px;border:1px solid var(--edge);overflow:hidden;scroll-snap-align:start;position:relative;display:flex;flex-direction:column}
.shot .bar{height:22px;background:linear-gradient(180deg,#e9f4fd,#c9e0f5);border-bottom:1px solid #a9c5de;display:flex;align-items:center;padding:0 8px;gap:4px}
.shot .bar i{width:8px;height:8px;border-radius:50%;background:#98b5d0}
.shot .cv{flex:1;padding:14px;display:grid;gap:8px;grid-template-columns:1fr 2fr;background:#fbfcfe}
.shot .cv div{border-radius:6px;background:var(--fill)}
.shot .cv div:nth-child(1){grid-row:span 3}
.shot .cap{position:absolute;left:10px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:999px}
.desc{font-size:14.5px;line-height:1.7;color:var(--t2);max-width:720px}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.whatsnew{display:flex;justify-content:space-between;gap:20px;padding:14px 16px;border-radius:10px;background:#f7fafd;border:1px solid var(--edge-soft)}
.whatsnew .v{font:600 13px var(--mono)}
.whatsnew .d{font-size:12px;color:var(--t4);margin-top:2px}
.whatsnew p{margin:0;flex:1;font-size:13.5px;color:var(--t2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.readme{font-size:13.5px;line-height:1.7;color:var(--t2)}
.readme h4{margin:14px 0 4px;font-size:13.5px;font-weight:700;color:var(--t1)}
.readme ul{margin:6px 0;padding-left:20px}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 24px}
.info div{padding:10px 0;border-bottom:1px solid var(--edge-soft);font-size:13px}
.info .k{font-size:11.5px;color:var(--t4);margin-bottom:2px}
.info .v{font-weight:500}
.vers{display:flex;flex-direction:column;gap:0}
.ver{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--edge-soft);font-size:13px}
.ver b{font:600 13px var(--mono);min-width:48px}
.ver .d{color:var(--t4);font-size:12px;min-width:90px}
.ver .n{flex:1;color:var(--t2)}
.ver .reason{flex-basis:100%;color:var(--danger);font-size:12.5px;padding-left:60px}
.manage{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px dashed var(--edge);display:flex;align-items:center;gap:12px;font-size:13px;color:var(--t2)}
.manage b{font-weight:600}
.manage .sp{flex:1}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:14px}
.banner.bad{background:var(--danger-soft);color:var(--danger)}.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner .sp{flex:1}

/* 评分与评论 */
.rsum{display:grid;grid-template-columns:130px 1fr auto;gap:24px;align-items:center;padding:16px 18px;border-radius:12px;background:#f7fafd;border:1px solid var(--edge-soft)}
.rsum .big{text-align:center}
.rsum .big b{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.rsum .big .stars{font-size:14px;display:flex;justify-content:center;margin:4px 0 2px}
.rsum .big span{font-size:12px;color:var(--t4)}
.bars{display:flex;flex-direction:column;gap:4px;max-width:340px}
.bar{display:grid;grid-template-columns:14px 1fr 26px;gap:8px;align-items:center;font-size:11.5px;color:var(--t4)}
.bar i{display:block;height:7px;border-radius:4px;background:#e6ecf4;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--star);border-radius:4px;transition:width .4s}
.compose{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--edge);background:#fff;display:none;flex-direction:column;gap:10px}
.compose.open{display:flex}
.compose .row{display:flex;align-items:center;gap:12px}
.compose .row b{font-weight:600}
.pick{display:inline-flex;gap:2px;font-size:26px;color:#d7dee8;cursor:pointer}
.pick i{font-style:normal;transition:transform .08s}
.pick i.on{color:var(--star)}.pick i:hover{transform:scale(1.15)}
.compose textarea,.sheet textarea,.sheet input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:8px;outline:0;resize:vertical;line-height:1.55;background:#fff}
.compose textarea:focus,.sheet textarea:focus,.sheet input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.compose .foot{display:flex;justify-content:space-between;align-items:center}
.compose .foot span{font-size:12px;color:var(--t4)}
.reviews{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.review{padding:14px 16px;border-radius:12px;border:1px solid var(--edge-soft);background:#fff;display:flex;flex-direction:column;gap:6px}
.review.mine{border-color:#bcd8f2;background:#f5f9fe}
.review .h{display:flex;align-items:center;gap:8px;font-size:12.5px}
.review .h .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#cfd8e3,#9fb1c6);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.review .h b{font-weight:600}
.review .h .d{color:var(--t4);margin-left:auto}
.review .h .stars{font-size:12px}
.review p{margin:0;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.review .tools{display:flex;gap:12px;margin-top:2px}
.review .tools .link{font-size:12px}
.reply{margin-top:4px;padding:10px 12px;border-radius:8px;background:#f7fafd;border-left:3px solid var(--accent);font-size:13px}
.reply b{font-weight:600;font-size:12.5px}
.reply .d{color:var(--t4);font-size:11.5px;margin-left:8px}
.reply p{margin:3px 0 0}
.helpful{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t4);margin-top:4px}
.helpful button{color:var(--t3);border:1px solid var(--edge-soft);border-radius:999px;padding:1px 9px;font-size:11px}
.helpful button.on{color:var(--accent);border-color:var(--accent)}

/* 资料库 */
.rows{display:flex;flex-direction:column;gap:6px}
.row-app{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:1px solid var(--edge-soft);background:#fff}
.row-app .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(180deg,#f6f9fd,#e9f0f8);border:1px solid var(--edge-soft)}
.row-app .m{flex:1;min-width:0}
.row-app .n{font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.row-app .n code{font-size:11.5px}
.row-app .d{font-size:12.5px;color:var(--t3);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-app .acts{display:flex;gap:8px;flex:none}
.row-app.tall{display:block}
.row-app.tall .line{display:flex;align-items:center;gap:12px}
.timeline{margin:12px 0 2px 56px;padding-left:14px;border-left:2px solid var(--edge);display:flex;flex-direction:column;gap:8px}
.tl{position:relative;font-size:12.5px;color:var(--t2);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tl::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:#c3d2e4;border:2px solid #fff;box-shadow:0 0 0 1px var(--edge)}
.tl.ok::before{background:var(--ok)}.tl.bad::before{background:var(--danger)}.tl.warn::before{background:var(--warn)}
.tl b{font:600 12.5px var(--mono)}
.tl .d{color:var(--t4)}
.tl .reason{flex-basis:100%;color:var(--danger);padding:6px 10px;border-radius:6px;background:var(--danger-soft)}
.tl .link{font-size:12px}

/* 审核 */
.queue{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.qlist{display:flex;flex-direction:column;gap:6px}
.q{padding:10px 12px;border-radius:10px;border:1px solid var(--edge-soft);cursor:pointer;display:flex;gap:10px;align-items:center}
.q:hover{background:#f7fafd}.q.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.q .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--fill);flex:none}
.q .n{font-size:13.5px;font-weight:600}.q .d{font-size:12px;color:var(--t4)}
.q .age{margin-left:auto;font-size:11px;color:var(--t4);white-space:nowrap}
.qdetail{border:1px solid var(--edge-soft);border-radius:12px;padding:18px 20px;position:sticky;top:0}
.qdetail .h{display:flex;gap:14px;align-items:center}
.qdetail .ic{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:32px;background:var(--fill)}
.qdetail h3{margin:0;font-size:18px}
.qdetail .by{font-size:12.5px;color:var(--t3)}
.qdetail .acts{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:2px;margin:16px 0 12px;border-bottom:1px solid var(--edge-soft)}
.tab{height:32px;padding:0 12px;font-size:13px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--t1);font-weight:600;border-bottom-color:var(--t1)}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:center;font-size:13px;padding:8px 10px;border-radius:8px;background:#f7fafd}
.check i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--ok);font-style:normal;flex:none}
.check i.warn{background:var(--warn)}.check i.bad{background:var(--danger)}
.check span{color:var(--t4);margin-left:auto;font-size:12px}
.tree{font:12.5px/1.7 var(--mono);color:var(--t2);white-space:pre}
.tree .dim{color:var(--t4)}
.diff{font:12.5px/1.7 var(--mono);white-space:pre;border-radius:8px;border:1px solid var(--edge-soft);padding:10px 12px;overflow:auto}
.diff .add{background:#e6f7ee;display:block}.diff .del{background:#fdeceb;display:block}
.templ{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.templ button{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--t2);background:#fff}
.templ button:hover{background:var(--fill)}

/* 登录门 */
.gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:3}
.gate .box{text-align:center;max-width:440px;padding:20px}
.gate .ic{font-size:56px;margin-bottom:8px}
.gate h2{margin:0 0 6px;font-size:20px;font-weight:800}
.gate p{margin:0 0 16px;color:var(--t3);line-height:1.6}
.gate .preview{margin-top:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;opacity:.55;pointer-events:none;filter:saturate(.7)}
.gate .preview .card{padding:8px}.gate .preview .card .ic{width:32px;height:32px;font-size:18px;border-radius:9px;margin:0}
.gate .preview .card .n{font-size:12px}.gate .preview .card .d{display:none}
.gate .state{margin-top:14px;font-size:12px;color:var(--t4);display:flex;align-items:center;justify-content:center;gap:6px}
.gate .state i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

/* 表单页(Sheet)与吐司 */
.scrim{position:absolute;inset:0;background:rgba(21,24,31,.32);display:none;align-items:center;justify-content:center;z-index:6}
.scrim.open{display:flex}
.sheet{width:440px;max-width:calc(100% - 40px);max-height:calc(100% - 60px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);padding:20px 22px 18px;display:flex;flex-direction:column;gap:12px;animation:pop .16s ease-out}
.sheet.wide{width:560px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.sheet h4{margin:0;font-size:16px;font-weight:700}
.sheet p{margin:0;font-size:13px;color:var(--t2);line-height:1.6}
.sheet label{font-size:12.5px;font-weight:600;color:var(--t2);display:block;margin-bottom:5px}
.sheet .f{display:flex;flex-direction:column}
.sheet .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.sheet .kv{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--edge-soft)}
.sheet .kv span{color:var(--t4);min-width:110px}
.toasts{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:7}
.toast{padding:9px 14px;border-radius:9px;background:#1d2532;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .16s ease-out;display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--danger)}.toast.ok{background:#1f8f63}
.toast .link{color:#fff;text-decoration:underline;font-size:12.5px}
</style>
</head>

function toast(t,cls="",action){const el=document.createElement("div");el.className="toast "+cls;el.innerHTML=h(t)+(action?` <button class="link">${h(action.label)}</button>`:"");if(action)$("button",el).onclick=()=>{action.fn();el.remove()};$("#toasts").append(el);setTimeout(()=>el.remove(),4200)}
function sheet(html,wide){const sc=$("#scrim");sc.innerHTML=`<form class="sheet${wide?" wide":""}">${html}</form>`;sc.classList.add("open");const f=$("form",sc);f.onsubmit=e=>e.preventDefault();sc.onmousedown=e=>{if(e.target===sc)closeSheet()};setTimeout(()=>{const t=$("textarea,input[type=text]",f);t&&t.focus()},30);return f}

/** 通用问询:标题 + 说明 + 可选文本(必填与否)→ Promise<string|null> */
function ask({title,message,placeholder,required,confirm,danger,initial="",templates}){return new Promise(res=>{
  const f=sheet(`<h4>${h(title)}</h4>${message?`<p>${h(message)}</p>`:""}${placeholder!==undefined?`<div class="f">${templates?`<div class="templ">${templates.map(t=>`<button type="button">${h(t)}</button>`).join("")}</div>`:""}<textarea rows="4" placeholder="${h(placeholder)}">${h(initial)}</textarea></div>`:""}
    <div class="actions"><button type="button" class="btn" data-x>Cancel</button><button type="submit" class="btn ${danger?"danger":"pri"}" ${required?"disabled":""}>${h(confirm)}</button></div>`);
  const ta=$("textarea",f),ok=$("[type=submit]",f);

  $("[data-x]",f).onclick=()=>{closeSheet();res(null)};f.onsubmit=e=>{e.preventDefault();if(ok.disabled)return;closeSheet();res(ta?ta.value.trim():"")};

function go(route,push=true){if(push&&S.route)S.stack.push(S.route);S.route=route;render();$("#scroll").scrollTop=0}

function render(){renderNav();renderFoot();renderGate();const r=S.route;const V=$("#view"),T=$("#top");
  const top=(title,sub="",canBack=false)=>T.innerHTML=`${canBack?`<button class="back" onclick="back()"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`:""}<h1>${title}</h1><span class="sub">${sub}</span>`;
  ({discover(){top("Discover");V.innerHTML=Discover()},search(){top("Search",`${S.q?`“${h(S.q)}”`:""}`);V.innerHTML=Search()},app(){const a=byId(r.id);top(h(a.name),h(a.author),true);V.innerHTML=AppPage(a)},

    review(){top("Review",`${QUEUE.length} waiting`);V.innerHTML=Review()},category(){top(r.cat);S.cat=r.cat;V.innerHTML=Discover(true)}})[r.name]();
  bind(V)}
function renderNav(){const m=me();const u=updates().length;const on=n=>S.route.name===n?"on":"";

const cardHTML=(a,no)=>`<div class="card" data-app="${a.id}">${no?`<span class="no">${no}</span>`:""}<span class="ic">${a.icon}</span><span class="m"><span class="n">${h(a.name)}</span><span class="d">${h(a.desc)}</span><span class="r">${a.reviews.length?`${stars(avg(a))} ${avg(a).toFixed(1)} · `:""}${a.installs} installs${a.src?"":" · no src"}</span></span>${getBtn(a,"sm pill")}</div>`;
function getBtn(a,cls=""){const st=state(a);const p=S.progress[a.id];if(p!==undefined)return `<button class="btn get busy ${cls}" style="--p:${p}%" data-p="${p<100?p+"%":"…"}" data-get="${a.id}">Install</button>`;
  if(st==="installed")return `<button class="btn get ${cls}" data-open="${a.id}">Open</button>`;
  if(st==="update")return `<button class="btn get pri ${cls}" data-get="${a.id}">Update</button>`;
  if(!a.listed)return `<button class="btn get ${cls}" disabled>Unavailable</button>`;

    <div class="facts">

    ${a.reviews.length?`<div class="rsum"><div class="big"><b>${avg(a).toFixed(1)}</b>${stars(avg(a))}<span>${a.reviews.length} ${a.reviews.length===1?"rating":"ratings"}</span></div><div class="bars">${hist.map(([n,c])=>`<div class="bar"><span>${n}</span><i><b style="width:${c/a.reviews.length*100}%"></b></i><span>${c}</span></div>`).join("")}</div><div>${isOwner?`<span class="hint" style="margin:0">Publishers cannot rate their own apps.</span>`:mine?`<button class="btn" data-compose>Edit your review</button>`:`<button class="btn pri" data-compose>Write a review</button>`}</div></div>`:`<div class="empty" style="padding:24px"><b>No reviews yet</b>${isOwner?"Publishers cannot rate their own apps.":"Be the first to rate this app."}</div>`}

      <textarea rows="3" placeholder="What works well, what does not (optional)">${mine?h(mine.body):""}</textarea><div class="foot"><span>Shown with your account name.</span><span>${mine?`<button class="btn" data-delrev>Delete review</button> `:""}<button class="btn" data-cancel>Cancel</button> <button class="btn pri" data-post ${mine?"":"disabled"}>${mine?"Update review":"Post review"}</button></span></div></div>
    <div class="reviews">${a.reviews.map(r=>`<div class="review ${r.me?"mine":""}"><div class="h"><span class="av">${h(r.user.split(" ").map(x=>x[0]).join(""))}</span><b>${r.me?"You":h(r.user)}</b>${stars(r.rating)}<span class="d">${r.d}</span></div><p>${h(r.body)}</p>
      ${r.reply?`<div class="reply"><b>${h(a.author)} · publisher</b><span class="d">${r.reply.d}</span><p>${h(r.reply.t)}</p></div>`:""}

        <span class="tools" style="margin-left:auto">${r.me?`<button class="link" data-compose>Edit</button>`:""}${(r.me||me().admin)?`<button class="link danger" data-delrev="${r.uid}">Delete</button>`:""}${isOwner?`<button class="link" data-reply="${r.uid}">${r.reply?"Edit reply":"Reply"}</button>`:""}</span></div></div>`).join("")}</div>

function md(t){return t.split("\n").map(l=>l.startsWith("### ")?`<h4>${h(l.slice(4))}</h4>`:l.startsWith("## ")?`<h4>${h(l.slice(3))}</h4>`:l.startsWith("- ")?`<li>${inl(l.slice(2))}</li>`:l.trim()?`<p>${inl(l)}</p>`:"").join("").replace(/(<li>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`)}
function inl(s){return h(s).replace(/`([^`]+)`/g,"<code>$1</code>")}
function Library(onlyUpdates){const ups=updates();const list=APPS.filter(a=>S.installed.has(a.id));
  return `<div class="page narrow">${ups.length?`<h2 class="sec">Updates <small>${ups.length}</small><button class="more" data-updateall>Update all</button></h2><div class="rows">${ups.map(a=>`<div class="row-app"><span class="ic">${a.icon}</span><span class="m"><span class="n" data-app="${a.id}">${h(a.name)}</span><span class="d">${S.localVer[a.id]} → ${a.version} · ${h(a.versions[0].n)}</span></span><span class="acts">${getBtn(a,"sm pill")}</span></div>`).join("")}</div>`:onlyUpdates?`<div class="empty"><b>Everything is up to date</b>Updates appear here when a publisher ships a newer version.</div>`:""}
  ${onlyUpdates?"":`<h2 class="sec">Installed <small>${list.length}</small></h2><div class="rows">${list.map(a=>`<div class="row-app"><span class="ic">${a.icon}</span><span class="m"><span class="n" data-app="${a.id}">${h(a.name)} <code>${a.id}</code></span><span class="d"><span>${S.localVer[a.id]||a.version}</span><span>${h(a.author)}</span>${!a.listed?`<span class="pill bad">Taken down · keeps working</span>`:""}</span></span><span class="acts">${getBtn(a,"sm")}<button class="btn sm" data-remove="${a.id}">Remove</button></span></div>`).join("")}</div>`}</div>`}
function Publish(){const m=me();
  return `<div class="page narrow"><p class="hint">Every app under <code>apps/</code>. Publishing packs the directory (without <code>node_modules</code> and <code>data.db</code>) and submits one version for review; the version on sale stays available meanwhile. Apps with <code>package.json</code> must include <code>src/</code>.</p>
  <div class="rows">${WORKSPACE.map(w=>{const own=w.owner===m.id,taken=w.owner!==0&&!own,a=byId(w.id),pend=w.submissions.find(s=>s.status==="pending");
    return `<div class="row-app tall"><div class="line"><span class="ic">${w.icon}</span><span class="m"><span class="n">${h(w.name)} <code>${w.id}</code></span><span class="d"><span>v${w.version}</span><span>${w.src?"ships src/":"no src/"}</span>${w.modified?`<span class="pill warn">Modified locally</span>`:""}${a&&own?(a.listed?`<span class="pill ok">On sale · ${a.version}</span>`:`<span class="pill bad">Taken down</span>`):""}${taken?`<span class="pill bad">Id owned by another account</span>`:""}${!a&&own&&pend?`<span class="pill warn">First version under review</span>`:""}</span></span>
      <span class="acts">${a&&own?(a.listed?`<button class="btn sm" data-delist="${a.id}">Take down</button>`:(a.delist.by!=="admin"?`<button class="btn sm" data-relist="${a.id}">Relist</button>`:"")):""}<button class="btn sm pri" data-publish="${w.id}" ${taken||pend?"disabled":""}>${pend?"Under review":a?"Publish update":"Publish"}</button></span></div>
      ${a&&own&&!a.listed?`<div class="banner bad" style="margin:10px 0 0 56px">Taken down${a.delist.by==="admin"?" by Wandesk":""}: ${h(a.delist.note)}</div>`:""}
      ${w.submissions.length?`<div class="timeline">${w.submissions.map(s=>`<div class="tl ${s.status==="approved"?"ok":s.status==="rejected"?"bad":s.status==="pending"?"warn":""}"><b>${s.v}</b><span class="pill ${s.status==="approved"?"ok":s.status==="rejected"?"bad":s.status==="pending"?"warn":"mute"}">${{approved:"On sale",pending:"Under review",rejected:"Rejected",withdrawn:"Withdrawn"}[s.status]}</span><span class="d">${s.d}</span><span>${h(s.notes)}</span>${s.status==="pending"?`<button class="link danger" data-withdraw="${w.id}|${s.v}">Withdraw</button>`:""}${s.reason?`<span class="reason">Reason: ${h(s.reason)} — bump the version and publish again.</span>`:""}</div>`).join("")}</div>`:""}

function Review(){const q=QUEUE[S.qi||0];if(!q)return `<div class="page"><div class="empty"><b>Nothing is waiting</b>Submissions appear here as they arrive.</div></div>`;const tab=S.qtab||"checks";
  return `<div class="page"><div class="queue"><div class="qlist">${QUEUE.map((x,i)=>`<div class="q ${i===(S.qi||0)?"on":""}" data-qi="${i}"><span class="ic">${x.icon}</span><span><div class="n">${h(x.name)} ${x.v}</div><div class="d">${h(x.author)} · ${x.replaces?`replaces ${x.replaces}`:"first version"}</div></span><span class="age">${x.age}</span></div>`).join("")}</div>
    <div class="qdetail"><div class="h"><span class="ic">${q.icon}</span><div><h3>${h(q.name)} <span style="font:600 15px var(--mono);color:var(--t3)">${q.v}</span></h3><div class="by">${h(q.author)} · ${h(q.email)} · ${kb(q.kb)} · ${q.src?"ships src/":"no src/"} · submitted ${q.age} ago</div></div><div class="acts"><button class="btn" data-reject>Reject…</button><button class="btn pri" data-approve ${q.checks.some(c=>c[1]==="bad")?"disabled title='A blocking check failed'":""}>Approve</button></div></div>
      <p class="hint" style="margin-top:12px"><b>Release notes:</b> ${h(q.notes)}</p>
      <div class="tabs">${[["checks","Checks"],["diff","Manifest diff"],["tree","Package"],["readme","README"]].map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-qtab="${k}">${l}</button>`).join("")}</div>
      ${tab==="checks"?`<div class="checks">${q.checks.map(([t,s,n])=>`<div class="check"><i class="${s}">${s==="ok"?"✓":"!"}</i>${h(t)}${n?`<span>${h(n)}</span>`:""}</div>`).join("")}</div>`:tab==="diff"?`<div class="diff">${q.diff.split("\n").map(l=>l.startsWith("+")?`<span class="add">${h(l)}</span>`:l.startsWith("-")?`<span class="del">${h(l)}</span>`:h(l)+"\n").join("")}</div>`:tab==="tree"?`<div class="tree">${h(q.tree)}</div>`:`<div class="readme">${md(`## ${q.name}\n\n${q.notes}\n\n### Data\nOne table in the app's database.`)}</div>`}
    </div></div></div>`}

function bind(V){
  V.querySelectorAll("[data-app]").forEach(el=>el.onclick=e=>{if(e.target.closest("button"))return;go({name:"app",id:el.dataset.app})});
  V.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>{S.q=el.dataset.q;$("#q").value=S.q;go({name:"search"})});
  V.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{S.cat=el.dataset.cat;render()});
  V.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go==="category"?{name:"category",cat:el.dataset.cat}:{name:el.dataset.go}));
  V.querySelectorAll("[data-get]").forEach(el=>el.onclick=e=>{e.stopPropagation();install(byId(el.dataset.get))});
  V.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{e.stopPropagation();toast(`${byId(el.dataset.open).name} opened`)});
  V.querySelectorAll("[data-remove]").forEach(el=>el.onclick=async e=>{e.stopPropagation();const a=byId(el.dataset.remove);if(await ask({title:`Remove ${a.name} from this desktop?`,message:"The directory is deleted. The app's data stays in the workspace store and returns if the app is installed again.",confirm:"Remove",danger:true})===null)return;S.installed.delete(a.id);delete S.localVer[a.id];render();toast(`${a.name} removed`,"",{label:"Undo",fn(){S.installed.add(a.id);render()}})});
  V.querySelectorAll("[data-updateall]").forEach(el=>el.onclick=()=>updates().forEach(a=>install(a)));
  V.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{const t=$("#"+el.dataset.toggle);t.hidden=!t.hidden});
  // 评论
  V.querySelectorAll("[data-compose]").forEach(el=>el.onclick=()=>{$("#compose").classList.add("open");$("#compose").scrollIntoView({block:"center"})});
  const comp=$("#compose",V);if(comp){const a=byId(comp.dataset.for);let rating=(a.reviews.find(r=>r.me)||{}).rating||0;const lbl=["","Poor","Fair","Good","Very good","Excellent"];
    const paint=v=>comp.querySelectorAll("#pick i").forEach(i=>i.classList.toggle("on",+i.dataset.v<=v));
    comp.querySelectorAll("#pick i").forEach(i=>{i.onmouseenter=()=>{paint(+i.dataset.v);$("#picklbl").textContent=lbl[+i.dataset.v]};i.onclick=()=>{rating=+i.dataset.v;$("[data-post]",comp).disabled=false}});
    $("#pick",comp).onmouseleave=()=>{paint(rating);$("#picklbl").textContent=rating?lbl[rating]:"Select a rating"};
    $("[data-cancel]",comp).onclick=()=>comp.classList.remove("open");
    $("[data-post]",comp).onclick=()=>{const body=$("textarea",comp).value.trim();let r=a.reviews.find(x=>x.me);if(r){r.rating=rating;r.body=body;r.d="2026-09-11"}else a.reviews.unshift({user:me().name,uid:me().id,rating,body,d:"2026-09-11",helpful:0,reply:null,me:true});render();toast("Your review is posted","ok")};
    const del=$("[data-delrev]",comp);if(del)del.onclick=async()=>{if(await ask({title:"Delete your review?",confirm:"Delete",danger:true})===null)return;a.reviews=a.reviews.filter(x=>!x.me);render();toast("Review deleted")}}
  V.querySelectorAll(".review [data-delrev]").forEach(el=>el.onclick=async()=>{const a=byId(S.route.id);const r=a.reviews.find(x=>x.uid==el.dataset.delrev);if(await ask({title:r.me?"Delete your review?":`Delete the review by ${r.user}?`,message:r.me?undefined:"Admin action. The author is not notified.",confirm:"Delete",danger:true})===null)return;a.reviews=a.reviews.filter(x=>x!==r);render();toast("Review deleted")});
  V.querySelectorAll("[data-reply]").forEach(el=>el.onclick=async()=>{const a=byId(S.route.id);const r=a.reviews.find(x=>x.uid==el.dataset.reply);const t=await ask({title:`Reply to ${r.user}`,message:`“${r.body}”`,placeholder:"Your reply as the publisher",initial:r.reply?r.reply.t:"",confirm:r.reply?"Update reply":"Reply"});if(t===null)return;r.reply=t?{t,d:"2026-09-11"}:null;render();toast(t?"Reply posted":"Reply removed")});
  V.querySelectorAll("[data-helpful]").forEach(el=>el.onclick=()=>{const k=S.route.id+el.dataset.helpful;S.helpful.has(k)?S.helpful.delete(k):S.helpful.add(k);render()});
  // 上下架
  V.querySelectorAll("[data-delist]").forEach(el=>el.onclick=async()=>{const a=byId(el.dataset.delist);const note=await ask({title:`Take ${a.name} down?`,message:"The app leaves the catalog and can no longer be installed. Desktops that already have it keep it.",placeholder:"Reason (shown to the publisher)",required:true,confirm:"Take down",danger:true,templates:me().admin?["Violates the content policy","Broken on the current Wandesk","Publisher request"]:["Maintenance","Superseded by another app"]});if(note===null)return;a.listed=false;a.delist={by:me().admin&&ownerOf(a)!==me().id?"admin":"owner",note};render();toast(`${a.name} taken down`)});
  V.querySelectorAll("[data-relist]").forEach(el=>el.onclick=async()=>{const a=byId(el.dataset.relist);if(await ask({title:`Put ${a.name} back on sale?`,message:"The app returns to the catalog immediately.",confirm:"Relist"})===null)return;a.listed=true;a.delist=null;render();toast(`${a.name} is back on sale`,"ok")});
  // 发布
  V.querySelectorAll("[data-publish]").forEach(el=>el.onclick=()=>publishFlow(WORKSPACE.find(w=>w.id===el.dataset.publish)));
  V.querySelectorAll("[data-withdraw]").forEach(el=>el.onclick=async()=>{const [id,v]=el.dataset.withdraw.split("|");const w=WORKSPACE.find(x=>x.id===id);if(await ask({title:`Withdraw ${w.name} ${v} from review?`,message:"A withdrawn version cannot be resubmitted; publish again under a higher version number.",confirm:"Withdraw",danger:true})===null)return;w.submissions.find(s=>s.v===v).status="withdrawn";const qi=QUEUE.findIndex(q=>q.id===id&&q.v===v);if(qi>=0)QUEUE.splice(qi,1);render();toast(`${w.name} ${v} withdrawn`)});
  // 审核
  V.querySelectorAll("[data-qi]").forEach(el=>el.onclick=()=>{S.qi=+el.dataset.qi;S.qtab="checks";render()});
  V.querySelectorAll("[data-qtab]").forEach(el=>el.onclick=()=>{S.qtab=el.dataset.qtab;render()});
  const ap=$("[data-approve]",V);if(ap)ap.onclick=async()=>{const q=QUEUE[S.qi||0];if(await ask({title:`Approve ${q.name} ${q.v}?`,message:q.replaces?`It replaces ${q.replaces} in the catalog and its manifest becomes the app's.`:"It becomes the first version on sale.",confirm:"Approve"})===null)return;decide(q,"approved")};
  const rj=$("[data-reject]",V);if(rj)rj.onclick=async()=>{const q=QUEUE[S.qi||0];const note=await ask({title:`Reject ${q.name} ${q.v}`,placeholder:"Reason (shown to the publisher)",required:true,confirm:"Reject",danger:true,templates:["The description must say what the app does.","Apps with package.json must ship src/.","The app does not open on the current Wandesk.","The README is missing."]});if(note===null)return;decide(q,"rejected",note)};
}
function install(a){if(S.progress[a.id]!==undefined)return;const was=state(a);const w=WORKSPACE.find(x=>x.id===a.id);
  const start=()=>{S.progress[a.id]=0;render();const t=setInterval(()=>{S.progress[a.id]=Math.min(100,S.progress[a.id]+Math.round(12+Math.random()*22));document.querySelectorAll(`[data-get="${a.id}"]`).forEach(b=>{b.style.setProperty("--p",S.progress[a.id]+"%");b.dataset.p=S.progress[a.id]<100?S.progress[a.id]+"%":"…"});if(S.progress[a.id]>=100){clearInterval(t);setTimeout(()=>{delete S.progress[a.id];S.installed.add(a.id);delete S.localVer[a.id];if(was==="absent")a.installs++;render();toast(`${a.name} ${was==="update"?"updated to":"installed,"} ${a.version}`,"ok",{label:"Open",fn(){toast(`${a.name} opened`)}})},350)}},160)};
  if(was==="update"&&w&&w.modified){ask({title:`Replace your changes to ${a.name}?`,message:`This app was modified in this workspace. Updating replaces it with ${a.version}; the app's data is kept.`,confirm:"Update anyway",danger:true}).then(r=>{if(r!==null)start()});return}
  start()}
function publishFlow(w){const a=byId(w.id);const problems=[];if(!w.version)problems.push("app.json has no version");if(!w.src&&w.id!=="timer")problems.push("package.json present but no src/");
  const f=sheet(`<h4>Publish ${h(w.name)}</h4><p>${a?`On sale now: <b>${a.version}</b>. The new version is reviewed before it replaces it.`:"The app is reviewed before it appears in the catalog."}</p>
    <div class="kv"><span>Version</span><b>${w.version}</b>${a&&a.version===w.version?`<span class="pill bad">must be newer than ${a.version}</span>`:""}</div><div class="kv"><span>Package</span>app.json · APP.md · server.js · public/ ${w.src?"· src/ · package.json":""}<br><small style="color:var(--t4)">without node_modules and data.db · about ${w.src?"41":"6"} KB</small></div><div class="kv"><span>Publisher</span>${h(me().name)} · ${h(me().email)}</div>
    <div class="checks" style="margin-top:4px"><div class="check"><i>✓</i>app.json has all seven fields</div><div class="check"><i class="${w.src?"":"warn"}">${w.src?"✓":"!"}</i>${w.src?"Ships src/":"Single-file app (no package.json) — src/ not required"}</div>${w.modified?`<div class="check"><i class="warn">!</i>Modified since install — your changes are what gets published</div>`:""}</div>
    <div class="f"><label>Release notes</label><textarea rows="3" placeholder="What changed in this version (shown on the app page)"></textarea></div>
    <div class="actions"><button type="button" class="btn" data-x>Cancel</button><button type="submit" class="btn pri" ${a&&a.version===w.version?"disabled":""}>${me().admin?"Publish":"Submit for review"}</button></div>`);
  $("[data-x]",f).onclick=closeSheet;f.onsubmit=e=>{e.preventDefault();const notes=$("textarea",f).value.trim()||"—";closeSheet();w.owner=me().id;
    if(me().admin){w.submissions.unshift({v:w.version,status:"approved",d:"2026-09-11",notes});if(a){a.version=w.version;a.versions.unshift({v:w.version,n:notes,d:"2026-09-11",status:"approved"})}render();toast(`${w.name} ${w.version} is on sale`,"ok")}
    else{w.submissions.unshift({v:w.version,status:"pending",d:"2026-09-11 10:40",notes});QUEUE.unshift({id:w.id,name:w.name,icon:w.icon,v:w.version,replaces:a?a.version:"",author:me().name,email:me().email,kb:w.src?41:6,src:w.src,age:"just now",notes,checks:[["app.json has all seven fields","ok"],[w.src?"Ships src/":"Single-file app","ok"],["server.js present","ok"]],tree:"app.json  APP.md  server.js  public/  src/",diff:`- "version": "${a?a.version:"—"}",\n+ "version": "${w.version}",`});render();toast(`${w.name} ${w.version} submitted for review`,"ok")}}}
function decide(q,status,note){QUEUE.splice(QUEUE.indexOf(q),1);S.qi=0;const w=WORKSPACE.find(x=>x.id===q.id);const s=w&&w.submissions.find(x=>x.v===q.v);if(s){s.status=status;if(note)s.reason=note}
  const a=byId(q.id);if(status==="approved"){if(a){a.version=q.v;a.versions.unshift({v:q.v,n:q.notes,d:"2026-09-11",status:"approved"});a.listed=true}else APPS.push(Object.assign(app(q.id,q.name,q.icon,"Tools",q.notes,q.author,q.v,q.kb,0,[[q.v,q.notes,"2026-09-11"]],q.src)))}
  else if(a)a.versions.unshift({v:q.v,n:q.notes,d:"2026-09-11",status:"rejected",reason:note});
  render();toast(`${q.name} ${q.v} ${status}`,status==="approved"?"ok":"")}

// 搜索、快捷键、角色
$("#q").oninput=e=>{S.q=e.target.value;if(S.route.name!=="search"){S.stack.push(S.route);S.route={name:"search"}}render()};
$("#q").onkeydown=e=>{if(e.key==="Escape"){e.target.blur();$("#q").value="";S.q="";back()}};
document.onkeydown=e=>{if(e.key==="/"&&document.activeElement!==$("#q")&&!$("#scrim").classList.contains("open")){e.preventDefault();$("#q").focus()}else if(e.key==="Escape"){if($("#scrim").classList.contains("open"))closeSheet();else if(document.activeElement!==$("#q"))back()}};
document.querySelectorAll(".devbar [data-role]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".devbar [data-role]").forEach(x=>x.classList.toggle("on",x===b));S.role=b.dataset.role;APPS.forEach(a=>a.reviews.forEach(r=>r.me=r.uid===me().id));S.stack=[];S.route={name:"discover"};render()});
render();
</script>
</body>
